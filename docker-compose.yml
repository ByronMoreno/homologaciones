version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: homologasys-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homologasys
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: homologasys-web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=run.py
      - FLASK_DEBUG=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/homologasys
      - SECRET_KEY=dev-key-super-secret-12345
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  postgres_data:
