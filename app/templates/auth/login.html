{% extends "base.html" %}

{% block title %}Iniciar Sesión - HomologaSys{% endblock %}

{% block body_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-primary py-5 px-3">
    <div class="glass-card-premium w-100" style="max-width: 420px; animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
        <!-- Header decorativo -->
        <div class="p-4 text-center border-bottom text-white position-relative" style="background: linear-gradient(135deg, var(--color-brand) 0%, var(--color-info) 100%);">
            <div class="mb-3 mt-2 display-6 text-white">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h2 class="h4 mb-1 fw-bold text-white">HomologaSys</h2>
            <p class="text-white-50 mb-0 style-display" style="font-size: 0.85rem;">Portal de Gestión y Homologación - Yavirac - UNIB.E</p>
            
            <button onclick="toggleTheme()" class="btn btn-sm btn-link text-white position-absolute top-0 end-0 m-3 opacity-75 hover-opacity-100" title="Cambiar Tema">
                <i class="bi bi-brightness-high-fill fs-5"></i>
            </button>
        </div>

        <!-- Formulario -->
        <div class="p-4 p-md-5">
            <form action="{{ url_for('auth.login') }}" method="POST" class="d-flex flex-column gap-4">
                <div>
                    <label for="username" class="form-label fw-semibold text-secondary mb-2" style="font-size: 0.85rem;">Usuario administrativo</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 bg-transparent text-secondary" style="border-color: var(--border-glass);">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" class="form-control form-premium border-start-0 ps-0" id="username" name="username" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>

                <div>
                    <label for="password" class="form-label fw-semibold text-secondary mb-2" style="font-size: 0.85rem;">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 bg-transparent text-secondary" style="border-color: var(--border-glass);">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control form-premium border-start-0 ps-0" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label text-secondary" for="remember" style="font-size: 0.85rem;">
                            Recordarme
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-premium btn-premium-primary py-2.5 w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right"></i>
                    <span>Iniciar Sesión</span>
                </button>
            </form>
        </div>
        
        <!-- Pie de página -->
        <div class="p-4 bg-light border-top text-center" style="background-color: var(--bg-tertiary) !important; border-color: var(--border-glass) !important;">
            <p class="text-secondary mb-0" style="font-size: 0.8rem;">
                ¿Eres estudiante? <a href="{{ url_for('students.login') }}" class="fw-semibold text-decoration-none" style="color: var(--color-brand);">Ingresa aquí</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
