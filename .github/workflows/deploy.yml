name: Deploy HomologaSys System

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PATH }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/byronmoreno/homologaciones:${{ github.sha }}
            ghcr.io/byronmoreno/homologaciones:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pre-create deploy directory on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            mkdir -p /home/${{ secrets.VPS_USER }}/app

      - name: Copy stack.yml and Makefile to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "stack.yml,Makefile"
          target: "/home/${{ secrets.VPS_USER }}/app"

      - name: Execute Swarm Deployment on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "🚀 Iniciando despliegue de HomologaSys"
            cd /home/${{ secrets.VPS_USER }}/app
            
            # Escribir archivo .env directamente en el VPS con export
            echo "export FLASK_CONFIG='${{ secrets.FLASK_CONFIG }}'" > .env
            echo "export SECRET_KEY='${{ secrets.SECRET_KEY }}'" >> .env
            echo "export POSTGRES_USER='${{ secrets.POSTGRES_USER }}'" >> .env
            echo "export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}'" >> .env
            echo "export POSTGRES_DB='${{ secrets.POSTGRES_DB }}'" >> .env
            echo "export POSTGRES_HOST='${{ secrets.POSTGRES_HOST }}'" >> .env
            echo "export POSTGRES_PORT='${{ secrets.POSTGRES_PORT }}'" >> .env
            
            echo "${{ secrets.GHCR_PATH }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📦 Descargando imagen"
            docker pull ghcr.io/byronmoreno/homologaciones:latest
            
            # Limpiar red bridge conflictiva previa si existiese
            docker network rm homologaciones_homologaciones-net || true
            
            echo "🔄 Actualizando stack en Docker Swarm"
            . .env && docker stack deploy -c stack.yml homologaciones
            
            echo "✅ Despliegue completado con éxito"
